name: 发布版本

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run ci
      - if: runner.os == 'macOS' && matrix.node == 24
        run: sh .github/scripts/verify-macos-runtime.sh

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Require a public GitHub repository
        shell: bash
        run: test "$(gh api "repos/${{ github.repository }}" --jq .visibility)" = "public"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci --ignore-scripts
      - run: npm run release:check:publish
      - run: npm run release:package
      - run: npm run release:notes -- --output release-notes.md
      - id: package
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - run: npm publish "dist/local-wiki-mcp-${{ steps.package.outputs.version }}.tgz" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: >-
          gh release create "${{ github.ref_name }}"
          "dist/local-wiki-mcp-${{ steps.package.outputs.version }}.tgz"
          "dist/local-wiki-mcp-${{ steps.package.outputs.version }}.sha256"
          "dist/local-wiki-mcp-${{ steps.package.outputs.version }}.manifest.json"
          --verify-tag
          --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
